name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - compiler/**
      - std/**
      - runtime/**
      - include/**
      - cmake/**
      - CMakeLists.txt
      - CMakePresets.json
      - VERSION
      - tools/check_docs.py
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - compiler/**
      - std/**
      - runtime/**
      - include/**
      - cmake/**
      - CMakeLists.txt
      - CMakePresets.json
      - VERSION
      - tools/check_docs.py
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Build Lyra from the documentation commit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils cmake ninja-build \
            clang-18 clang-tools-18 llvm-18-dev libclang-18-dev lld-18 \
            libgc-dev libuv1-dev libsqlite3-dev libjansson-dev libssl-dev zlib1g-dev
          cmake --preset dev -DBUILD_TESTING=OFF
          cmake --build --preset dev --target lyra --parallel 2
      - name: Verify the tutorial code examples
        run: python3 tools/check_docs.py --lyra build/dev/bin/lyra
      - name: Install dependencies
        working-directory: docs
        run: npm ci
      - name: Check the documentation site
        working-directory: docs
        run: npm run check
      - name: Build the documentation site
        working-directory: docs
        run: npm run build
      - name: Upload the site artifact
        if: github.repository == 'isyuah/lyra' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: docs/dist

  deploy:
    if: github.repository == 'isyuah/lyra' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
