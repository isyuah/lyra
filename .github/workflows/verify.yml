name: Verify Lyra SDK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test on Ubuntu 22.04 and verify the relocated SDK
        run: docker build --progress plain --platform linux/amd64 -f tests/jammy.Dockerfile --target verify .

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify native builds and relocated SDK
        shell: pwsh
        run: ./tests/verify-windows.ps1 -Tools "${{ runner.temp }}/lyra-tools"
